name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build execsnoop (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (with libbpf and bpftool submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake make clang-18 llvm-18 libelf-dev zlib1g-dev

      - name: Show tool versions
        run: |
          cmake --version | head -1
          clang-18 --version | head -1
          gcc --version | head -1

      - name: Configure
        run: cmake -S . -B build -DCMAKE_C_COMPILER=clang-18

      - name: Build
        run: cmake --build build -j

      - name: Install into a staging prefix
        run: cmake --install build --prefix "$PWD/dist/usr/local"

      - name: Upload execsnoop
        uses: actions/upload-artifact@v4
        with:
          name: execsnoop-ubuntu-24.04-x86_64
          path: dist/usr/local
          if-no-files-found: error

  release:
    name: publish GitHub release
    # Only for version tags; branch pushes and manual runs stop after build.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the build artifact
        uses: actions/download-artifact@v4
        with:
          name: execsnoop-ubuntu-24.04-x86_64
          path: pkg

      - name: Package and checksum
        run: |
          set -euo pipefail
          NAME="execsnoop-${GITHUB_REF_NAME}-ubuntu-24.04-x86_64"
          tar -C pkg -czf "${NAME}.tar.gz" .
          sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          ls -l "${NAME}".tar.gz*

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          # no checkout in this job, so gh cannot infer the repository
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          FILES=(execsnoop-"${GITHUB_REF_NAME}"-ubuntu-24.04-x86_64.tar.gz*)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${FILES[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${FILES[@]}" \
              --title "execsnoop ${GITHUB_REF_NAME}" --generate-notes
          fi
